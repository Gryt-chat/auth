name: CI

# Nothing checked the login theme before this. A stylesheet with an unclosed brace built
# clean and took the sign-in page down for five hours on 2026-09-01.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  login-theme:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: login-theme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: login-theme/package-lock.json

      # `npm ci` runs the postinstall, `keycloakify sync-extensions`, which vendors the
      # pages under src/login/pages and everything in public/. The build needs both.
      - run: npm ci

      # lint:css, then build, then check the built bundle still has every class the source
      # styles. The middle step used to pass while dropping a third of the stylesheet.
      - run: npm run verify

      # Not `typecheck`: it covers the vendored pages, and one ships an unused
      # @ts-expect-error that fails under our settings. package.json says the same.

  identity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: identity/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn build
      - run: yarn test

  # No comment runs past two lines. Its own job because the one above is pinned to
  # login-theme, and this reads the whole repository.
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-comment-length.mjs
      - run: node scripts/check-retired-logo.mjs

      # Code here is TypeScript so its types get checked (GRYT-1800). A file that has to stay
      # JavaScript goes in .js-allowlist, one path a line, with a # comment saying why.
      - name: No new JavaScript
        run: |
          allowed=$(grep -v '^#' .js-allowlist 2>/dev/null || true)
          found=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' | grep -vxF -e "$allowed" -e '' || true)
          if [ -n "$found" ]; then
            echo "::error::JavaScript not on .js-allowlist. Write it in TypeScript (GRYT-1800):"
            echo "$found"
            exit 1
          fi
