# Subject lines for the mail Keycloak sends (GRYT-141).
#
# The theme sets parent=base, so every subject came from Keycloak's defaults.
# The keys and their stock values below were read out of
# org.keycloak.keycloak-themes-26.5.3.jar rather than from memory.
#
# One of them is a real problem. VERIFY_EMAIL is an enabled required action, so
# registration sends the execute-actions mail rather than the verification one,
# and its stock subject is "Update Your Account". That does not say who it is
# from, does not say what it wants, and reads like the opening line of a
# phishing attempt. Somebody who has just signed up for Gryt has no reason to
# connect it to Gryt.
#
# The rest are terse rather than wrong: "Login error", "Remove OTP". They are
# fine in a list of Keycloak strings and poor in an inbox next to mail from
# everybody else.
#
# The rule for all of them is the same. Name the sender and name the action, so
# the subject matches what is inside and a person can tell at a glance whether
# they asked for it. That is also the advice for not being filed as phishing.

# ── Things the person just asked for ──────────────────────────────────
emailVerificationSubject=Confirm your email address for Gryt
emailUpdateConfirmationSubject=Confirm your new email address for Gryt
executeActionsSubject=Finish setting up your Gryt account
passwordResetSubject=Reset your Gryt password
identityProviderLinkSubject=Link your {0} account to Gryt

# ── Notifications about something that already happened ───────────────
# Past tense, because that is what they are. A subject in the imperative reads
# as a demand to act on mail that needs no action, which is both confusing and
# the shape a phishing subject takes.
eventUpdatePasswordSubject=Your Gryt password was changed
eventUpdateCredentialSubject=A sign-in method was added to your Gryt account
eventRemoveCredentialSubject=A sign-in method was removed from your Gryt account
eventUpdateTotpSubject=Two-factor authentication was added to your Gryt account
eventRemoveTotpSubject=Two-factor authentication was removed from your Gryt account
eventLoginErrorSubject=A failed sign-in to your Gryt account
eventUserDisabledByTemporaryLockoutSubject=Your Gryt account is temporarily locked
eventUserDisabledByPermanentLockoutSubject=Your Gryt account has been locked

# ── Account lifecycle ─────────────────────────────────────────────────
accountDisableNotificationSubject=Your Gryt account has been disabled
accountDeleteNotificationSubject=Your Gryt account is scheduled for deletion
