# The admin console, in Gryt's colours and darker than anything users see.
#
# `parent=keycloak.v2` is Keycloak's own admin console — the React app in
# org.keycloak.keycloak-admin-ui. This theme adds a stylesheet and a logo to it
# and changes nothing else, the same trade the account theme makes: PatternFly
# resolves every colour from one table of custom properties, so remapping that
# table is the whole theme and no component is restyled. A Keycloak upgrade that
# changes a component cannot break it.
#
# Verified against 26.5.3 rather than assumed: the console's own stylesheet uses
# --pf-v5-* throughout, 16,240 references and no v6, so it is the same PatternFly
# generation the account console is on and the same remap applies.
#
# **This is the master realm's theme, not gryt's.** auth.gryt.chat/admin is the
# master console. Setting adminTheme on the gryt realm changes nothing you can
# see there.
parent=keycloak.v2

# Leading slash, unlike the account theme's `img/logo.svg`. The admin console
# decides with `d.startsWith("/") ? join(resourceUrl, d) : d` -- read out of
# main-CCEN_uGR.js, not guessed -- so a relative path is used verbatim and 404s
# against /admin/master/console/. That is what rendered the alt text instead of
# a logo. `${resourceUrl}` is not substituted here either; index.ftl passes
# properties.logo through raw on line 148.
logo=/img/logo.svg
logoUrl=https://gryt.chat
# index.ftl builds this as ${resourceUrl}${properties.favIcon} with no separator,
# so this one needs the leading slash for a different reason.
favIcon=/img/logo.svg
favIconType=image/svg+xml

title=Gryt admin

# index.ftl lists `properties.styles` after the console's own bundle, so these
# win on specificity ties without !important on every rule.
styles=css/tokens.css css/admin.css
