# The account console, in Gryt's colours.
#
# `parent=keycloak.v3` is Keycloak's own account console — the React app that
# ships in org.keycloak.keycloak-account-ui. This theme adds a stylesheet and a
# logo to it and changes nothing else, which is why it is a handful of files
# rather than a build.
#
# It is not a Keycloakify theme like the login one, and that is not a
# preference: @keycloakify/keycloak-account-ui peers on React 18 and PatternFly
# 5, login-theme/ is on React 19, and every published line of the account UI
# wants React 18 — 26.7's included, so waiting for a Keycloak upgrade would not
# help. Painting the console we already serve is the smaller and more honest
# change.
parent=keycloak.v3

# Without these the masthead shows Keycloak's own logo. That is what somebody
# following the "delete your account" link from docs.gryt.chat lands on.
logo=img/logo.svg
logoUrl=https://gryt.chat
favIcon=img/logo.svg
favIconType=image/svg+xml

title=Your Gryt account

# index.ftl lists `properties.styles` after the console's own bundle, so these
# win on specificity ties without !important on every rule.
styles=css/tokens.css css/account.css
