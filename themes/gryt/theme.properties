# The email theme and the account theme live in this directory.
#
# The login theme moved to login-theme/, which Keycloakify compiles into a jar
# that Keycloak loads from /opt/keycloak/providers. Email keeps its own
# hand-written .ftl overrides here — those work, and Keycloakify's email support
# is a separate job. Account is here for a different reason: it is Keycloak's
# own console with a stylesheet on top, so there is nothing to compile. Its own
# theme.properties has the whole of that.
#
# There is deliberately no `styles=` line: it used to point at
# login/resources/css/gryt.css, which went with the old login theme.
parent=base
