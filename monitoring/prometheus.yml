global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets:
          - keycloak:9000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187


  # Serves cached counts, refreshed hourly. Under 5m, or a 30-day panel's lookback misses it.
  - job_name: reach
    scrape_interval: 1m
    static_configs:
      - targets:
          - reach-exporter:9800

  - job_name: gryt-servers
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.yml]
