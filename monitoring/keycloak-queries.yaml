# Account and activity counts for the postgres-exporter, so "how many people use
# Gryt" has an answer that is not a psql shell (GRYT-1082).
#
# Nothing here collects anything. Keycloak already keeps these rows to run
# sessions at all, and last_session_refresh is a timestamp it maintains whether
# or not anybody reads it. No IP addresses, no per-user output -- every query
# aggregates to a count before it leaves the database.
#
# Every query joins realm on name rather than filtering realm_id against a
# string. realm_id is a UUID, and offline_user_session holds ids for realms that
# no longer exist -- 45 of 97 rows on 2026-09-08. A filter that looks reasonable
# and skips the join counts those too, which is how the first numbers reported
# for this were wrong.

gryt_keycloak_accounts:
  query: |
    SELECT
      r.name                                              AS realm,
      count(*)::float                                     AS registered,
      count(*) FILTER (WHERE u.enabled)::float            AS enabled,
      count(*) FILTER (WHERE u.email_verified)::float     AS verified
    FROM user_entity u
    JOIN realm r ON r.id = u.realm_id
    GROUP BY r.name
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - registered:
        usage: "GAUGE"
        description: "Accounts that exist in this realm"
    - enabled:
        usage: "GAUGE"
        description: "Accounts not disabled"
    - verified:
        usage: "GAUGE"
        description: "Accounts with a verified email address"

# There is no window past 30 days here, and there cannot be. The realm sets
# offlineSessionIdleTimeout to 2592000, so Keycloak deletes an offline session
# once it has been idle that long and the row stops existing. A 90-day gauge
# would return the same number as the 30-day one forever, which is why there
# isn't one. Measured 2026-09-08: 30d, 90d, 365d and "ever" were all 29.
#
# What "active" means here, because the number gets quoted: a client is holding
# an offline token and refreshed it inside the window. That is closer to "the app
# is installed and signed in" than to "this person used Gryt today", and it misses
# anyone who signs in without an offline token. Honest for what it measures; not
# the same thing as an active user.
gryt_keycloak_active_users:
  query: |
    SELECT
      r.name AS realm,
      count(DISTINCT s.user_id) FILTER (
        WHERE s.last_session_refresh > extract(epoch FROM now()) - 86400)::float   AS day,
      count(DISTINCT s.user_id) FILTER (
        WHERE s.last_session_refresh > extract(epoch FROM now()) - 604800)::float  AS week,
      count(DISTINCT s.user_id) FILTER (
        WHERE s.last_session_refresh > extract(epoch FROM now()) - 2592000)::float AS month,
      count(DISTINCT s.user_id)::float                                             AS ever
    FROM offline_user_session s
    JOIN realm r ON r.id = s.realm_id
    GROUP BY r.name
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - day:
        usage: "GAUGE"
        description: "Distinct users whose session refreshed in the last 24 hours"
    - week:
        usage: "GAUGE"
        description: "Distinct users whose session refreshed in the last 7 days"
    - month:
        usage: "GAUGE"
        description: "Distinct users whose session refreshed in the last 30 days"
    - ever:
        usage: "GAUGE"
        description: "Distinct users holding any offline session"

# New accounts in trailing windows. The totals above are levels -- how many
# exist, how many checked in -- and neither says whether the number is moving.
#
# Trailing windows rather than a gauge per calendar month, because a per-month
# series adds a label every month and cannot be summed. Prometheus builds the
# history itself from gryt_keycloak_accounts_registered going forward; these are
# what give a number before that history exists.
#
# These do go past 30 days, unlike the activity gauges. created_timestamp is a
# column on a row that is never deleted, so the window is a real choice here.
gryt_keycloak_signups:
  query: |
    SELECT
      r.name AS realm,
      count(*) FILTER (
        WHERE u.created_timestamp > (extract(epoch FROM now()) - 86400)   * 1000)::float AS day,
      count(*) FILTER (
        WHERE u.created_timestamp > (extract(epoch FROM now()) - 604800)  * 1000)::float AS week,
      count(*) FILTER (
        WHERE u.created_timestamp > (extract(epoch FROM now()) - 2592000) * 1000)::float AS month,
      count(*) FILTER (
        WHERE u.created_timestamp > (extract(epoch FROM now()) - 7776000) * 1000)::float AS quarter
    FROM user_entity u
    JOIN realm r ON r.id = u.realm_id
    GROUP BY r.name
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - day:
        usage: "GAUGE"
        description: "Accounts created in the last 24 hours"
    - week:
        usage: "GAUGE"
        description: "Accounts created in the last 7 days"
    - month:
        usage: "GAUGE"
        description: "Accounts created in the last 30 days"
    - quarter:
        usage: "GAUGE"
        description: "Accounts created in the last 90 days"

gryt_keycloak_sessions:
  query: |
    SELECT
      r.name AS realm,
      count(*)::float AS offline
    FROM offline_user_session s
    JOIN realm r ON r.id = s.realm_id
    GROUP BY r.name
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - offline:
        usage: "GAUGE"
        description: "Offline sessions held in this realm"

# Sessions pointing at a realm that is gone. Harmless to Keycloak, and the reason
# every count above joins rather than filters. Worth a graph because a number
# that climbs means something is deleting realms without cleaning up after them.
gryt_keycloak_orphan:
  query: |
    SELECT count(*)::float AS sessions
    FROM offline_user_session s
    LEFT JOIN realm r ON r.id = s.realm_id
    WHERE r.id IS NULL
  metrics:
    - sessions:
        usage: "GAUGE"
        description: "Offline sessions whose realm no longer exists"
