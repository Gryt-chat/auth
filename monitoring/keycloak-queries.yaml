# Account and activity counts for the postgres-exporter (GRYT-1082). Every query joins realm
# on name rather than filtering realm_id: 45 of 97 offline rows point at realms that are gone.

gryt_keycloak_accounts:
  query: |
    SELECT
      r.name                                              AS realm,
      count(*)::float                                     AS registered,
      count(*) FILTER (WHERE u.enabled)::float            AS enabled,
      count(*) FILTER (WHERE u.email_verified)::float     AS verified
    FROM user_entity u
    JOIN realm r ON r.id = u.realm_id
    GROUP BY r.name
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - registered:
        usage: "GAUGE"
        description: "Accounts that exist in this realm"
    - enabled:
        usage: "GAUGE"
        description: "Accounts not disabled"
    - verified:
        usage: "GAUGE"
        description: "Accounts with a verified email address"

# No window past 30 days, and there cannot be: offlineSessionIdleTimeout deletes the row.
# "Active" means a client holding an offline token refreshed it — not an active user.
gryt_keycloak_active_users:
  query: |
    SELECT
      r.name AS realm,
      count(DISTINCT s.user_id) FILTER (
        WHERE s.last_session_refresh > extract(epoch FROM now()) - 86400)::float   AS day,
      count(DISTINCT s.user_id) FILTER (
        WHERE s.last_session_refresh > extract(epoch FROM now()) - 604800)::float  AS week,
      count(DISTINCT s.user_id) FILTER (
        WHERE s.last_session_refresh > extract(epoch FROM now()) - 2592000)::float AS month,
      count(DISTINCT s.user_id)::float                                             AS ever
    FROM offline_user_session s
    JOIN realm r ON r.id = s.realm_id
    GROUP BY r.name
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - day:
        usage: "GAUGE"
        description: "Distinct users whose session refreshed in the last 24 hours"
    - week:
        usage: "GAUGE"
        description: "Distinct users whose session refreshed in the last 7 days"
    - month:
        usage: "GAUGE"
        description: "Distinct users whose session refreshed in the last 30 days"
    - ever:
        usage: "GAUGE"
        description: "Distinct users holding any offline session"

# New accounts in trailing windows, which say whether the number is moving. These do go past
# 30 days: created_timestamp is on a row that is never deleted.
gryt_keycloak_signups:
  query: |
    SELECT
      r.name AS realm,
      count(*) FILTER (
        WHERE u.created_timestamp > (extract(epoch FROM now()) - 86400)   * 1000)::float AS day,
      count(*) FILTER (
        WHERE u.created_timestamp > (extract(epoch FROM now()) - 604800)  * 1000)::float AS week,
      count(*) FILTER (
        WHERE u.created_timestamp > (extract(epoch FROM now()) - 2592000) * 1000)::float AS month,
      count(*) FILTER (
        WHERE u.created_timestamp > (extract(epoch FROM now()) - 7776000) * 1000)::float AS quarter
    FROM user_entity u
    JOIN realm r ON r.id = u.realm_id
    GROUP BY r.name
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - day:
        usage: "GAUGE"
        description: "Accounts created in the last 24 hours"
    - week:
        usage: "GAUGE"
        description: "Accounts created in the last 7 days"
    - month:
        usage: "GAUGE"
        description: "Accounts created in the last 30 days"
    - quarter:
        usage: "GAUGE"
        description: "Accounts created in the last 90 days"

# Signups per calendar month, recomputed from user_entity on every scrape, so it is the only
# view that survives a wipe of Prometheus. Activity has no history to recompute from.
gryt_keycloak_signups_by_month:
  query: |
    SELECT
      r.name AS realm,
      to_char(to_timestamp(u.created_timestamp / 1000), 'YYYY-MM') AS month,
      count(*)::float AS accounts
    FROM user_entity u
    JOIN realm r ON r.id = u.realm_id
    GROUP BY r.name, 2
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - month:
        usage: "LABEL"
        description: "Calendar month the accounts were created in, YYYY-MM"
    - accounts:
        usage: "GAUGE"
        description: "Accounts created in that calendar month"

gryt_keycloak_signups_by_year:
  query: |
    SELECT
      r.name AS realm,
      to_char(to_timestamp(u.created_timestamp / 1000), 'YYYY') AS year,
      count(*)::float AS accounts
    FROM user_entity u
    JOIN realm r ON r.id = u.realm_id
    GROUP BY r.name, 2
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - year:
        usage: "LABEL"
        description: "Calendar year the accounts were created in"
    - accounts:
        usage: "GAUGE"
        description: "Accounts created in that calendar year"

gryt_keycloak_sessions:
  query: |
    SELECT
      r.name AS realm,
      count(*)::float AS offline
    FROM offline_user_session s
    JOIN realm r ON r.id = s.realm_id
    GROUP BY r.name
  metrics:
    - realm:
        usage: "LABEL"
        description: "Realm name"
    - offline:
        usage: "GAUGE"
        description: "Offline sessions held in this realm"

# Sessions pointing at a realm that is gone: harmless, and the reason every count above joins
# rather than filters. A number that climbs means something deletes realms without cleanup.
gryt_keycloak_orphan:
  query: |
    SELECT count(*)::float AS sessions
    FROM offline_user_session s
    LEFT JOIN realm r ON r.id = s.realm_id
    WHERE r.id IS NULL
  metrics:
    - sessions:
        usage: "GAUGE"
        description: "Offline sessions whose realm no longer exists"
