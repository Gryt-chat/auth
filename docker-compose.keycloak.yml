services:
  postgres:
    image: postgres:16-alpine
    container_name: gryt-auth-postgres
    environment:
      POSTGRES_DB: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD:-keycloak}
    volumes:
      - gryt-auth-postgres-data:/var/lib/postgresql/data
    networks:
      - gryt-auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRYT_AUTH_POSTGRES_USER:-keycloak} -d ${GRYT_AUTH_POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: gryt-auth-keycloak
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-import:
        condition: service_completed_successfully
      keycloak-bootstrap-admin:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${GRYT_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${GRYT_KEYCLOAK_ADMIN_PASSWORD:-admin}

      # Database
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD:-keycloak}

      # Hosting / proxy hints (Cloudflare Tunnel terminates TLS at the edge)
      KC_HOSTNAME: ${GRYT_KEYCLOAK_HOSTNAME_URL:-https://auth.gryt.chat}
      KC_HOSTNAME_ADMIN: ${GRYT_KEYCLOAK_HOSTNAME_ADMIN_URL:-https://auth.gryt.chat}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded

      # Theme caching (enable in production)
      KC_SPI_THEME_CACHE_THEMES: ${KC_SPI_THEME_CACHE_THEMES:-true}
      KC_SPI_THEME_CACHE_TEMPLATES: ${KC_SPI_THEME_CACHE_TEMPLATES:-true}
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"

      # HTTP
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"

      # Observability
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HTTP_MANAGEMENT_SCHEME: "http"
      KC_HTTP_ACCESS_LOG_ENABLED: "true"
      # update-email and recovery-codes are both opt-in on 26.5, so the two
      # required actions that let somebody change their own address or make
      # backup codes do not exist until this line names them. Adding a feature
      # is a rebuild, so this needs a restart rather than a realm setting.
      KC_FEATURES: user-event-metrics,update-email,recovery-codes
      KC_EVENT_METRICS_USER_ENABLED: "true"
    command:
      - start
    ports:
      - "${GRYT_KEYCLOAK_BIND:-0.0.0.0}:${GRYT_KEYCLOAK_PORT:-18080}:8080"
    volumes:
      # Email theme only — the login theme is the jar below.
      - ./themes:/opt/keycloak/themes:ro
      # The Keycloakify-built login theme. Build it with
      # `login-theme/build.sh`, which produces the jar in Docker so no JVM is
      # needed on the host. Keycloak loads themes from providers at startup, so
      # a rebuilt jar needs a container restart to take effect.
      - ./login-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/gryt-login-theme.jar:ro
    networks:
      - gryt-auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Catches every email the realm sends, so verification and reset flows can be
  # exercised locally without a mail provider or a real inbox. Mailpit rather
  # than MailHog: MailHog has been unmaintained since 2020, and this is a
  # drop-in with the same job.
  #
  # Deliberately has no profile guard — it is harmless when nothing sends mail,
  # and the alternative is a developer wondering where the verification email
  # went.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: gryt-auth-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      # 18025 is the web inbox, 11025 the SMTP port the realm is pointed at.
      - "${GRYT_MAILPIT_BIND:-127.0.0.1}:${GRYT_MAILPIT_UI_PORT:-18025}:8025"
      - "${GRYT_MAILPIT_BIND:-127.0.0.1}:${GRYT_MAILPIT_SMTP_PORT:-11025}:1025"
    networks:
      - gryt-auth-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: gryt-auth-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${GRYT_AUTH_POSTGRES_USER:-keycloak}:${GRYT_AUTH_POSTGRES_PASSWORD:-keycloak}@postgres:5432/${GRYT_AUTH_POSTGRES_DB:-keycloak}?sslmode=disable"
    networks:
      - gryt-auth-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gryt-auth-prometheus
    depends_on:
      keycloak:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
    ports:
      - "127.0.0.1:${GRYT_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - gryt-auth-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: gryt-auth-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRYT_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRYT_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/auth-overview.json
    ports:
      - "${GRYT_GRAFANA_BIND:-0.0.0.0}:${GRYT_GRAFANA_PORT:-13000}:3000"
    volumes:
      - gryt-auth-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gryt-auth-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: gryt-auth-alertmanager
    environment:
      GRYT_SMTP_HOST: ${GRYT_SMTP_HOST:-smtp.postmarkapp.com}
      GRYT_SMTP_PORT: ${GRYT_SMTP_PORT:-587}
      GRYT_SMTP_FROM: ${GRYT_SMTP_FROM:-hello@gryt.chat}
      GRYT_SMTP_USER: ${GRYT_SMTP_USER:-}
      GRYT_SMTP_PASS: ${GRYT_SMTP_PASS:-}
      GRYT_ALERT_EMAIL: ${GRYT_ALERT_EMAIL:-hello@gryt.chat}
    ports:
      - "127.0.0.1:${GRYT_ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp /etc/alertmanager/alertmanager.yml.tpl /tmp/alertmanager.yml
        sed -i \
          -e "s|__GRYT_SMTP_HOST__|$$GRYT_SMTP_HOST|g" \
          -e "s|__GRYT_SMTP_PORT__|$$GRYT_SMTP_PORT|g" \
          -e "s|__GRYT_SMTP_FROM__|$$GRYT_SMTP_FROM|g" \
          -e "s|__GRYT_SMTP_USER__|$$GRYT_SMTP_USER|g" \
          -e "s|__GRYT_SMTP_PASS__|$$GRYT_SMTP_PASS|g" \
          -e "s|__GRYT_ALERT_EMAIL__|$$GRYT_ALERT_EMAIL|g" \
          /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    networks:
      - gryt-auth-network
    restart: unless-stopped

  # Automatic pre-import backup.
  # Only runs when GRYT_IMPORT_REALM=1; writes a timestamped dump to ./backups/ before
  # the realm import can touch the database.
  keycloak-pre-import-backup:
    image: postgres:16-alpine
    container_name: gryt-auth-pre-import-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      PGUSER: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      PGPASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD:-keycloak}
      GRYT_IMPORT_REALM: ${GRYT_IMPORT_REALM:-0}
      BACKUP_MIN_BYTES: ${GRYT_BACKUP_MIN_BYTES:-10000}
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ "$$GRYT_IMPORT_REALM" != "1" ]; then
          echo "[pre-import-backup] GRYT_IMPORT_REALM!=1, skipping."
          exit 0
        fi
        # Every failure below exits non-zero, and that is the point of this
        # service rather than a detail of it. `keycloak-import` waits on this
        # one with `condition: service_completed_successfully`, and what it goes
        # on to run is `kc.sh import --override true`, which deletes the realm
        # and every account in it. An exit code from here is what stands between
        # a bad backup and an unrecoverable import.
        #
        # It did not used to be. There was no `set -e`, and the dump was
        # `pg_dump | gzip > "$$out"` — no pipefail, so a failed pg_dump handed
        # gzip an EOF, gzip wrote a valid empty archive and exited 0, the
        # pipeline succeeded, this printed "Done" and exited 0, and the import
        # proceeded with nothing to go back to. Not theoretical: the same
        # construct in the pg-backup service produced
        # keycloak-20260901T183343Z.sql.gz — twenty bytes, decompressing to zero.
        set -eu
        ts=$$(date -u +%Y%m%dT%H%M%SZ)
        final="/backups/keycloak-pre-import-$${ts}.sql.gz"
        raw="/backups/.keycloak-pre-import-$${ts}.sql"
        part="$${final}.part"
        trap 'rm -f "$${raw}" "$${part}"' EXIT

        echo "[pre-import-backup] Backing up before realm import: $${final}"

        # Uncompressed first, so what is checked is pg_dump's own exit status
        # rather than gzip's.
        if ! pg_dump > "$${raw}"; then
          echo "[pre-import-backup] REFUSING TO CONTINUE: pg_dump failed. The realm import must not run without a backup." >&2
          exit 1
        fi

        size=$$(wc -c < "$${raw}" | tr -d " ")
        if [ "$${size}" -lt "$${BACKUP_MIN_BYTES}" ]; then
          echo "[pre-import-backup] REFUSING TO CONTINUE: dump is $${size} bytes, under the $${BACKUP_MIN_BYTES} floor." >&2
          exit 1
        fi

        gzip -c "$${raw}" > "$${part}"
        if ! gzip -t "$${part}"; then
          echo "[pre-import-backup] REFUSING TO CONTINUE: the archive does not decompress." >&2
          exit 1
        fi

        mv "$${part}" "$${final}"
        echo "[pre-import-backup] Done ($$(du -h "$${final}" | cut -f1), from $${size} bytes)"
    volumes:
      - ${GRYT_AUTH_BACKUP_DIR:-./backups}:/backups
    networks:
      - gryt-auth-network
    restart: "no"

  # Deterministic config-as-code for dev/testing:
  # Import the realm JSON into the DB (overriding existing config) BEFORE Keycloak starts.
  # This avoids needing an admin login for automation (which can fail if the admin user is disabled/locked).
  # WARNING: --override true uses OVERWRITE_EXISTING, which DELETES the realm before re-creating it.
  # All users/sessions are lost. A backup is taken automatically (see keycloak-pre-import-backup).
  keycloak-import:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: gryt-auth-keycloak-import
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-pre-import-backup:
        condition: service_completed_successfully
    environment:
      # Database (same as keycloak)
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD:-keycloak}
      # Enable import only when explicitly requested
      GRYT_IMPORT_REALM: ${GRYT_IMPORT_REALM:-0}
      # SMTP (Postmark) - injected into realm import on each start.
      # DO NOT commit your token; set it via environment or a local .env file.
      GRYT_SMTP_HOST: ${GRYT_SMTP_HOST:-smtp.postmarkapp.com}
      GRYT_SMTP_PORT: ${GRYT_SMTP_PORT:-587}
      GRYT_SMTP_FROM: ${GRYT_SMTP_FROM:-hello@gryt.chat}
      GRYT_SMTP_FROM_NAME: ${GRYT_SMTP_FROM_NAME:-Gryt Chat}
      GRYT_SMTP_REPLY_TO: ${GRYT_SMTP_REPLY_TO:-hello@gryt.chat}
      GRYT_SMTP_REPLY_TO_NAME: ${GRYT_SMTP_REPLY_TO_NAME:-Gryt Chat}
      # Postmark server token (required for verification emails to work)
      GRYT_SMTP_USER: ${GRYT_SMTP_USER:-}
      GRYT_SMTP_PASS: ${GRYT_SMTP_PASS:-}
    entrypoint: ["bash", "/bootstrap/import_realm.sh"]
    volumes:
      - ./bootstrap/import_realm.sh:/bootstrap/import_realm.sh:ro
      - ./realm:/opt/keycloak/data/import-src:ro
    networks:
      - gryt-auth-network
    restart: "no"

  # Creates the master-realm administrator if there isn't one.
  # Runs between the import and the server, because the import is what stops
  # `start` from creating it. See bootstrap/bootstrap_admin.sh.
  keycloak-bootstrap-admin:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: gryt-auth-keycloak-bootstrap-admin
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-import:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD:-keycloak}
      GRYT_KEYCLOAK_ADMIN_USERNAME: ${GRYT_KEYCLOAK_ADMIN_USERNAME:-admin}
      GRYT_KEYCLOAK_ADMIN_PASSWORD: ${GRYT_KEYCLOAK_ADMIN_PASSWORD:-admin}
    entrypoint: ["bash", "/bootstrap/bootstrap_admin.sh"]
    volumes:
      - ./bootstrap/bootstrap_admin.sh:/bootstrap/bootstrap_admin.sh:ro
    networks:
      - gryt-auth-network
    restart: "no"

  # Sets the realm's declarative User Profile once Keycloak is up.
  #
  # It cannot live in keycloak-import: that runs `kc.sh import` before Keycloak
  # starts, and this is an admin API call that needs a running server. It also
  # cannot live in gryt-realm.json — a userProfile block there is rejected on
  # import and takes the stack down (GRYT-136). Hence a third one-shot.
  #
  # Has to follow every realm import, because `--override true` deletes the realm
  # and the profile with it. Note that `docker compose up -d` does NOT re-run a
  # one-shot that has already exited unless its config changed — up.sh recreates
  # this one explicitly. See bootstrap/apply_user_profile.sh.
  keycloak-user-profile:
    image: curlimages/curl:8.11.1
    container_name: gryt-auth-keycloak-user-profile
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_URL: http://keycloak:8080
      GRYT_REALM: ${GRYT_REALM:-gryt}
      GRYT_IMPORT_REALM: ${GRYT_IMPORT_REALM:-0}
      GRYT_KEYCLOAK_ADMIN_USERNAME: ${GRYT_KEYCLOAK_ADMIN_USERNAME:-admin}
      GRYT_KEYCLOAK_ADMIN_PASSWORD: ${GRYT_KEYCLOAK_ADMIN_PASSWORD:-admin}
    entrypoint: ["sh", "/bootstrap/apply_user_profile.sh"]
    volumes:
      - ./bootstrap/apply_user_profile.sh:/bootstrap/apply_user_profile.sh:ro
      - ./bootstrap/gryt-user-profile.json:/bootstrap/gryt-user-profile.json:ro
    networks:
      - gryt-auth-network
    restart: "no"

  keycloak-security-policy:
    image: curlimages/curl:8.11.1
    container_name: gryt-auth-keycloak-security-policy
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_URL: http://keycloak:8080
      GRYT_REALM: ${GRYT_REALM:-gryt}
      GRYT_KEYCLOAK_ADMIN_USERNAME: ${GRYT_KEYCLOAK_ADMIN_USERNAME:-admin}
      GRYT_KEYCLOAK_ADMIN_PASSWORD: ${GRYT_KEYCLOAK_ADMIN_PASSWORD:-admin}
      GRYT_KC_FAILURE_FACTOR: ${GRYT_KC_FAILURE_FACTOR:-8}
      GRYT_KC_WAIT_INCREMENT_SECONDS: ${GRYT_KC_WAIT_INCREMENT_SECONDS:-60}
      GRYT_KC_MAX_WAIT_SECONDS: ${GRYT_KC_MAX_WAIT_SECONDS:-900}
      GRYT_KC_MAX_DELTA_SECONDS: ${GRYT_KC_MAX_DELTA_SECONDS:-43200}
      GRYT_KC_PASSWORD_POLICY: ${GRYT_KC_PASSWORD_POLICY:-}
    entrypoint: ["sh", "/bootstrap/apply_security_policy.sh"]
    volumes:
      - ./bootstrap/apply_security_policy.sh:/bootstrap/apply_security_policy.sh:ro
    networks:
      - gryt-auth-network
    restart: "no"

  identity:
    build:
      context: ./identity
      dockerfile: Dockerfile
    container_name: gryt-identity
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      PORT: "3000"
      GRYT_OIDC_ISSUER: ${GRYT_OIDC_ISSUER:-https://auth.gryt.chat/realms/gryt}
      GRYT_IDENTITY_ORIGIN: ${GRYT_IDENTITY_ORIGIN:-https://id.gryt.chat}
      GRYT_CA_PRIVATE_KEY_FILE: ${GRYT_CA_PRIVATE_KEY_FILE:-}
      GRYT_IDENTITY_DATA_DIR: /app/data
      GRYT_CERT_LIFETIME_DAYS: ${GRYT_CERT_LIFETIME_DAYS:-30}
    ports:
      - "${GRYT_IDENTITY_BIND:-0.0.0.0}:${GRYT_IDENTITY_PORT:-18081}:3000"
    volumes:
      - gryt-identity-data:/app/data
    networks:
      - gryt-auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Scheduled Postgres backups (every 6 hours, retain 30 days).
  # Runs one backup immediately on start, then cron takes over.
  pg-backup:
    image: postgres:16-alpine
    container_name: gryt-auth-pg-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      PGUSER: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      PGPASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD:-keycloak}
      BACKUP_RETAIN_DAYS: ${GRYT_BACKUP_RETAIN_DAYS:-30}
      # A floor rather than a comparison against the last dump, because the
      # first run on a fresh realm has nothing to compare to and should still
      # be allowed. Well under a real dump and far above an empty one.
      BACKUP_MIN_BYTES: ${GRYT_BACKUP_MIN_BYTES:-10000}
      BACKUP_CRON: ${GRYT_BACKUP_CRON:-0 */6 * * *}
    entrypoint: ["sh", "-c"]
    command:
      - |
        cat > /usr/local/bin/pg-backup.sh << 'SCRIPT'
        #!/bin/sh
        # A dump that fails must not look like one that worked, and must never
        # be the reason an older good one is deleted.
        #
        # This used to be `pg_dump | gzip > "$$out"` under `set -eu`. There is no
        # pipefail here, so a pg_dump that failed still handed gzip an EOF, gzip
        # wrote a valid twenty-byte archive and exited 0, the pipeline succeeded,
        # and the script logged "Done" with the size of a file containing
        # nothing. keycloak-20260901T183343Z.sql.gz is that file: 20 bytes,
        # decompressing to zero, among 123 others of about 127 KB. It is the run
        # the container does on startup, so Postgres was presumably not up yet.
        #
        # One bad file is survivable. The prune underneath it is what is not: it
        # ran unconditionally, straight after the dump, so a pg_dump that broke
        # and stayed broken — a rotated password, a major version bump, a full
        # disk — would write empty archives four times a day while deleting the
        # real ones on a trailing edge, and say nothing. A month of that leaves
        # no backup at all, and a realm import deletes every account with the
        # dumps here as the only way back.
        set -eu
        ts=$$(date -u +%Y%m%dT%H%M%SZ)
        final="/backups/keycloak-$${ts}.sql.gz"
        raw="/backups/.keycloak-$${ts}.sql"
        part="$${final}.part"
        trap 'rm -f "$${raw}" "$${part}"' EXIT

        echo "[pg-backup] $$(date -u +%FT%TZ) Creating $${final}"

        # Uncompressed first, so the status being checked is pg_dump's own
        # rather than gzip's. The extra file is a couple of megabytes and lives
        # for one command.
        if ! pg_dump > "$${raw}"; then
          echo "[pg-backup] FAILED: pg_dump exited non-zero. Existing backups left alone." >&2
          exit 1
        fi

        size=$$(wc -c < "$${raw}" | tr -d " ")
        if [ "$${size}" -lt "$${BACKUP_MIN_BYTES}" ]; then
          echo "[pg-backup] FAILED: dump is $${size} bytes, under the $${BACKUP_MIN_BYTES} floor. Existing backups left alone." >&2
          exit 1
        fi

        gzip -c "$${raw}" > "$${part}"
        if ! gzip -t "$${part}"; then
          echo "[pg-backup] FAILED: the archive does not decompress. Existing backups left alone." >&2
          exit 1
        fi

        # Named only once it is known to be good, so a half-written file is
        # never mistaken for a backup by anything reading this directory.
        mv "$${part}" "$${final}"
        echo "[pg-backup] Done ($$(du -h "$${final}" | cut -f1), from $${size} bytes)"

        # Only here. Reaching this line means there is a verified dump from this
        # run, which is the thing that earns the right to delete an old one.
        find /backups -name 'keycloak-*.sql.gz' -mtime +"$${BACKUP_RETAIN_DAYS}" -delete -print \
          | while read f; do echo "[pg-backup] Pruned $${f}"; done
        SCRIPT
        chmod +x /usr/local/bin/pg-backup.sh
        /usr/local/bin/pg-backup.sh
        echo "$${BACKUP_CRON} /usr/local/bin/pg-backup.sh >> /proc/1/fd/1 2>&1" | crontab -
        echo "[pg-backup] Scheduled ($${BACKUP_CRON}). Waiting..."
        exec crond -f -l 6
    volumes:
      # Defaults to beside the compose file, which is where it has always been.
      # Point it at a mount from somewhere else and the dumps stop sharing a
      # filesystem with the database they exist to restore — which is the
      # failure that matters here, since a bad realm import deletes every
      # account and takes anything on the same disk with it if that disk is
      # what went wrong.
      - ${GRYT_AUTH_BACKUP_DIR:-./backups}:/backups
    networks:
      - gryt-auth-network
    restart: unless-stopped

networks:
  gryt-auth-network:
    driver: bridge

volumes:
  gryt-auth-postgres-data:
  gryt-auth-grafana-data:
  gryt-identity-data:

