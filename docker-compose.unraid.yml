# Monitoring for the VPS auth stack, run on Unraid (GRYT-2038). Start only metrics-tunnel, prometheus, alertmanager, grafana and reach-exporter.
# The tunnel answers as keycloak and postgres-exporter, so prometheus.yml is the same file the VPS would use.
services:
  metrics-tunnel:
    image: alpine:3.22
    container_name: gryt-auth-metrics-tunnel
    entrypoint: ["sh", "-c"]
    # The key on the VPS can only forward to these two ports; it can't run anything there.
    command:
      - |
        apk add --no-cache openssh-client >/dev/null
        exec ssh -N -i /keys/id_ed25519_metrics \
          -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/keys/known_hosts \
          -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
          -L 0.0.0.0:9000:127.0.0.1:19000 -L 0.0.0.0:9187:127.0.0.1:19187 \
          "${GRYT_METRICS_SSH_TARGET:?user@host for the tunnel, in .env}"
    volumes:
      - ${GRYT_METRICS_KEY_DIR:-/boot/config/gryt-backup}:/keys:ro
    networks:
      gryt-auth-network:
        aliases: [keycloak, postgres-exporter]
    restart: unless-stopped

  reach-exporter:
    image: node:24-alpine
    container_name: gryt-auth-reach-exporter
    command: ["node", "/app/reach.ts"]
    volumes:
      - ./reach-exporter:/app:ro
      # Its own folder, so the container sees the App Store Connect key and none of the SSH keys.
      - ${GRYT_REACH_KEY_DIR:-/boot/config/gryt-reach}:/keys:ro
    environment:
      GITHUB_TOKEN: ${GRYT_REACH_GITHUB_TOKEN:-}
      DISCORD_INVITE: ${GRYT_REACH_DISCORD_INVITE:-}
      SERVERS: ${GRYT_REACH_SERVERS:-community.gryt.chat}
      CLOUDFLARE_API_TOKEN: ${GRYT_REACH_CLOUDFLARE_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${GRYT_REACH_CLOUDFLARE_ZONE_ID:-}
      ASC_KEY_ID: ${GRYT_REACH_ASC_KEY_ID:-}
      ASC_ISSUER_ID: ${GRYT_REACH_ASC_ISSUER_ID:-}
      ASC_KEY_FILE: /keys/asc.p8
    networks:
      - gryt-auth-network
    restart: unless-stopped

  # Gryt servers to count who's online on. The target files stay on the box, not in git.
  prometheus:
    volumes:
      - ./monitoring/targets:/etc/prometheus/targets:ro
