# The auth stack on the Gigahost VPS, which is also the WireGuard hub every voice call goes through (GRYT-2034).
# Start only postgres, keycloak, identity, pg-backup and postgres-exporter there; the limits keep a busy Keycloak from starving it.
services:
  postgres:
    mem_limit: 512m
  keycloak:
    mem_limit: 1536m
    # Metrics for Unraid's SSH tunnel (docker-compose.unraid.yml). Localhost only, never the public address.
    ports:
      - "127.0.0.1:19000:9000"
  identity:
    mem_limit: 256m
  pg-backup:
    mem_limit: 128m
  postgres-exporter:
    mem_limit: 64m
    ports:
      - "127.0.0.1:19187:9187"
